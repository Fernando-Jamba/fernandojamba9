<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pauta de Avaliação - Formulário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-bottom: 30px;
    }
    .card {
      border-radius: 15px;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .container {
        padding-left: 15px;
        padding-right: 15px;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="3trimestre.html">📝 3º Trimestre</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="pauta_alunos.html">📝 Formulário</a></li>
        <li class="nav-item"><a class="nav-link" href="tabela.html">📊 Tabela</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-5">
  <div class="row">
    <div class="col-12">
      <h1 class="mb-2">Pauta de Avaliação</h1>
      <p class="text-muted mb-4">Registo de alunos e classificações</p>
    </div>
  </div>

  <!-- FORM -->
  <form id="formAluno" class="card p-3 p-md-4 shadow-sm">
    <h5 class="card-title mb-3">➕ Dados do Aluno</h5>
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label">Nome completo *</label>
        <input type="text" id="nome" class="form-control" required>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Idade *</label>
        <input type="number" id="idade" class="form-control" min="1" max="99" required>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Sala *</label>
        <input type="text" id="sala" class="form-control" placeholder="Ex: 101" required>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label">Turma *</label>
        <input type="text" id="turma" class="form-control" placeholder="Ex: A" required>
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label">Nº do Aluno *</label>
        <input type="text" id="numero" class="form-control" required>
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label">Turno *</label>
        <select id="turno" class="form-select" required>
          <option value="">Selecione...</option>
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
          <option value="Noite">Noite</option>
        </select>
      </div>
    </div>

    <hr class="my-4">
    <h5 class="card-title mb-3">📊 Notas (0 – 20)</h5>
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <label class="form-label">Nota 1</label>
        <input type="number" id="nota1" class="form-control" min="0" max="20" step="0.1" required>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Nota 2</label>
        <input type="number" id="nota2" class="form-control" min="0" max="20" step="0.1" required>
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Nota 3</label>
        <input type="number" id="nota3" class="form-control" min="0" max="20" step="0.1" required>
      </div>
    </div>

    <div class="mt-4 d-flex flex-column flex-sm-row gap-2">
      <button type="submit" class="btn btn-primary">➕ Adicionar aluno</button>
      <button type="reset" class="btn btn-secondary" onclick="limparFormulario()">🗑️ Limpar campos</button>
      <button type="button" class="btn btn-info" onclick="verTabela()">📊 Ver Tabela</button>
    </div>
  </form>

  <!-- Alertas de feedback -->
  <div id="alertMessage" style="display: none;" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
    <span id="alertText"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Inicializar array de alunos do localStorage
  let alunos = JSON.parse(localStorage.getItem('alunos')) || [];
  let contador = alunos.length > 0 ? Math.max(...alunos.map(a => a.id)) : 0;

  function verTabela() {
    window.location.href = 'tabelas.html';
  }

  function limparFormulario() {
    document.getElementById('formAluno').reset();
  }

  function mostrarAlerta(mensagem, tipo = 'success') {
    const alertDiv = document.getElementById('alertMessage');
    const alertText = document.getElementById('alertText');
    alertText.textContent = mensagem;
    alertDiv.className = `alert alert-${tipo} alert-dismissible fade show mt-3`;
    alertDiv.style.display = 'block';
    
    // Esconder alerta após 3 segundos
    setTimeout(() => {
      alertDiv.style.display = 'none';
    }, 3000);
  }

  document.getElementById('formAluno').addEventListener('submit', function(e) {
    e.preventDefault();

    // Validar campos obrigatórios
    const nome = document.getElementById('nome').value.trim();
    const idade = document.getElementById('idade').value.trim();
    const sala = document.getElementById('sala').value.trim();
    const turma = document.getElementById('turma').value.trim();
    const numero = document.getElementById('numero').value.trim();
    const turno = document.getElementById('turno').value;

    if (!nome || !idade || !sala || !turma || !numero || !turno) {
      mostrarAlerta('Por favor, preencha todos os campos obrigatórios!', 'danger');
      return;
    }

    const n1 = parseFloat(document.getElementById('nota1').value);
    const n2 = parseFloat(document.getElementById('nota2').value);
    const n3 = parseFloat(document.getElementById('nota3').value);

    if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
      mostrarAlerta('Por favor, preencha todas as notas!', 'danger');
      return;
    }

    if ([n1, n2, n3].some(n => n < 0 || n > 20)) {
      mostrarAlerta('Notas inválidas. Insira valores entre 0 e 20.', 'danger');
      return;
    }

    const media = ((n1 + n2 + n3) / 3);
    contador++;
    
    const aluno = { 
      id: contador, 
      nome, 
      idade: parseInt(idade), 
      sala, 
      turma, 
      numero, 
      turno, 
      n1, 
      n2, 
      n3, 
      media 
    };

    alunos.push(aluno);
    localStorage.setItem('alunos', JSON.stringify(alunos));

    mostrarAlerta(`✅ Aluno "${nome}" adicionado com sucesso!`);
    this.reset();
    
    // Opcional: Perguntar se quer ver a tabela
    setTimeout(() => {
      if (confirm('Aluno adicionado! Deseja visualizar a tabela agora?')) {
        window.location.href = 'tabelas.html';
      }
    }, 500);
  });
</script>
</body>
</html>
