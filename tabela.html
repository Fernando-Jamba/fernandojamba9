<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pauta - Tabela de Alunos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-bottom: 30px;
    }
    .table-responsive {
      border-radius: 10px;
      overflow-x: auto;
    }
    .btn-action {
      white-space: nowrap;
    }
    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }
      .table {
        font-size: 0.85rem;
      }
      .btn-sm {
        padding: 0.2rem 0.4rem;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="3trimestre.html">📊 3º Trimestre</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="pauta_alunos.html">📝 Formulário</a></li>
        <li class="nav-item"><a class="nav-link active" href="tabela.html">📊 Tabela</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-5">
  <div class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h1 class="mb-0">📋 Lista de Alunos</h1>
      <div class="d-flex gap-2">
        <button class="btn btn-success" onclick="window.location.href='index.html'">
          ➕ Novo Aluno
        </button>
        <button class="btn btn-danger" onclick="limparTodosDados()">
          🗑️ Limpar Tudo
        </button>
      </div>
    </div>
  </div>

  <!-- Tabela Responsiva -->
  <div class="table-responsive shadow rounded">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>Idade</th>
          <th>Sala</th>
          <th>Turma</th>
          <th>Nº Aluno</th>
          <th>Turno</th>
          <th>N1</th>
          <th>N2</th>
          <th>N3</th>
          <th>Média</th>
          <th>Resultado</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr>
          <td colspan="13" class="text-center text-muted py-4">
            📭 Nenhum aluno registado. Volte ao formulário para adicionar alunos.
           </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let alunos = [];

  // Carregar alunos do localStorage
  function carregarAlunos() {
    const stored = localStorage.getItem('alunos');
    if (stored) {
      alunos = JSON.parse(stored);
    } else {
      alunos = [];
    }
    renderTabela();
  }

  function renderTabela() {
    const tbody = document.getElementById('tbody');
    
    if (!alunos || alunos.length === 0) {
      tbody.innerHTML = `<tr><td colspan="13" class="text-center text-muted py-4">
        📭 Nenhum aluno registado. Volte ao formulário para adicionar alunos.
      </td></tr>`;
      return;
    }

    tbody.innerHTML = '';
    
    alunos.forEach((a, idx) => {
      // Determinar resultado
      let resultado = "Reprovado";
      let badgeClass = "danger";
      
      if (a.media >= 10) { 
        resultado = "Aprovado"; 
        badgeClass = "success"; 
      } else if (a.media >= 8) { 
        resultado = "Recurso"; 
        badgeClass = "warning text-dark"; 
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="align-middle">${idx + 1}</td>
        <td class="align-middle"><strong>${escapeHtml(a.nome)}</strong></td>
        <td class="align-middle">${a.idade}</td>
        <td class="align-middle">${escapeHtml(a.sala)}</td>
        <td class="align-middle">${escapeHtml(a.turma)}</td>
        <td class="align-middle">${escapeHtml(a.numero)}</td>
        <td class="align-middle">${escapeHtml(a.turno)}</td>
        <td class="align-middle text-center">${a.n1.toFixed(1)}</td>
        <td class="align-middle text-center">${a.n2.toFixed(1)}</td>
        <td class="align-middle text-center">${a.n3.toFixed(1)}</td>
        <td class="align-middle fw-bold text-center">${a.media.toFixed(2)}</td>
        <td class="align-middle text-center"><span class="badge bg-${badgeClass} px-3 py-2">${resultado}</span></td>
        <td class="align-middle text-center">
          <button class="btn btn-sm btn-danger btn-action" onclick="removerAluno(${a.id})" title="Remover aluno">
            🗑️ Remover
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Função para evitar XSS
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function removerAluno(id) {
    if (confirm('Tem certeza que deseja remover este aluno?')) {
      alunos = alunos.filter(a => a.id !== id);
      localStorage.setItem('alunos', JSON.stringify(alunos));
      carregarAlunos(); // Recarregar após remoção
      
      // Mostrar feedback
      showTemporaryMessage('Aluno removido com sucesso!', 'success');
    }
  }

  function limparTodosDados() {
    if (confirm('⚠️ ATENÇÃO: Isso irá apagar TODOS os alunos cadastrados. Tem certeza?')) {
      localStorage.removeItem('alunos');
      alunos = [];
      carregarAlunos();
      showTemporaryMessage('Todos os dados foram limpos!', 'info');
    }
  }

  function showTemporaryMessage(message, type = 'success') {
    // Criar elemento de alerta temporário
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
    alertDiv.style.cssText = 'top: 80px; right: 20px; z-index: 9999; min-width: 250px;';
    alertDiv.innerHTML = `
      ${message}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    document.body.appendChild(alertDiv);
    
    setTimeout(() => {
      alertDiv.remove();
    }, 3000);
  }

  // Verificar atualizações no localStorage (para sincronização entre abas)
  window.addEventListener('storage', function(e) {
    if (e.key === 'alunos') {
      carregarAlunos();
      showTemporaryMessage('📊 Dados atualizados de outra aba!', 'info');
    }
  });

  // Carregar dados quando a página for carregada
  document.addEventListener('DOMContentLoaded', carregarAlunos);
</script>
</body>
</html>
